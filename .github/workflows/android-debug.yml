name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Dejavu Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Cache ~/.mozbuild
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            mozbuild-${{ runner.os }}-

      - name: Bootstrap build environment
        run: |
          ./mach bootstrap --no-interactive --application-choice=mobile_android_artifact

      - name: Configure mozconfig
        run: |
          cat << 'EOF' > mozconfig
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64-linux-android
          ac_add_options --enable-artifact-builds
          mk_add_options MOZ_OBJDIR=./objdir-frontend
          EOF

      - name: Build with mach
        run: |
          ./mach build

      - name: Assemble Debug APK
        run: |
          ./mach gradle :fenix:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-debug-apk
          path: objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/debug/fenix-arm64-v8a-debug.apk
          if-no-files-found: error
