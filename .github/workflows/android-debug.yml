name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Dejavu Debug APK
    runs-on: ubuntu-latest
    # A full Gecko build from source on a 4-core runner takes hours.
    # 360 minutes is the maximum a GitHub-hosted job may run.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A standard ubuntu-latest runner only has ~14 GB of disk and a full
      # mozilla-central build needs far more (source + toolchains + objdir).
      # Remove preinstalled toolchains we do not use; `mach bootstrap`
      # installs the exact Android SDK / NDK this tree needs.
      # Runs BEFORE setup-java: that action re-creates what it needs inside
      # the tool cache afterwards.
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/share/boost /opt/ghc /opt/az
          sudo docker image prune -af || true
          df -h

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # Toolchains, Android SDK/NDK and the Rust toolchain live here.
      # Stable key: the contents only change when Mozilla bumps a
      # toolchain, so a per-commit key would only bloat the cache
      # (bump v1 to v2 manually if a toolchain upgrade needs a fresh one).
      - name: Cache ~/.mozbuild
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-v1

      # Full (non-artifact) build: compiles Gecko from source. Artifact
      # mode cannot work for this fork — its commits are not upstream
      # mozilla-central commits, so no prebuilt artifacts exist for them
      # (run #2 failed with "Tried 1 pushheads, no built artifacts found.").
      # NOTE: `mach bootstrap` takes no --no-interactive flag; it detects
      # a non-TTY (CI) itself and auto-accepts the Android SDK licences.
      - name: Bootstrap build environment
        run: |
          ./mach bootstrap --application-choice=mobile_android

      - name: Configure mozconfig
        run: |
          cat << 'EOF' > mozconfig
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64-linux-android
          mk_add_options MOZ_OBJDIR=./objdir-frontend
          EOF

      # v3 change (run #3 root cause): run #3 died in configure's C-compiler
      # check — `sccache clang /tmp/conftest.c -E` exited 2. The sccache in
      # play was bootstrap's copy at ~/.mozbuild/sccache/sccache, while the
      # workflow also installed mozilla-actions/sccache-action on PATH:
      # two sccache binaries, no known fix found in Tier 1 search. This run
      # DROPS sccache entirely — the one-run definitive test: if the build
      # goes green, sccache was the culprit; if it fails at the same
      # conftest, the toolchain itself is broken. Slower, but correct.
      # Bare-clang probe first: proves in the visible log whether the
      # bundled clang can preprocess at all without any wrapper.
      - name: Probe bare clang
        run: |
          printf 'int main(void){return 0;}\n' > /tmp/probe.c
          "$HOME/.mozbuild/clang/bin/clang" /tmp/probe.c -E -o /tmp/probe.i && echo PROBE-OK && head -3 /tmp/probe.i

      - name: Build with mach
        run: |
          ./mach build

      - name: Assemble Debug APK
        run: |
          ./mach gradle :fenix:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-debug-apk
          path: objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/debug/fenix-arm64-v8a-debug.apk
          if-no-files-found: error

      # On any failure, upload configure's log so the real reason is
      # diagnosable without a signed-in browser log read.
      - name: Upload config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-log
          path: objdir-frontend/config.log
          if-no-files-found: warn
